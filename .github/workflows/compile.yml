name: compile

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      # The PlatformIO toolchain download dominates a cold run, so it is cached across runs.
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv run --locked esphome config example/compile-test.yaml
      - run: uv run --locked esphome compile example/compile-test.yaml
